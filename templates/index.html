<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Carros</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Galeria de Carros</h1>
    <a href="{{ url_for('upload') }}" class="btn btn-primary mb-3">Enviar nova imagem</a>
    <div class="row">
        {% for img in imagens %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <img src="{{ url_for('static', filename='uploads/' ~ img[2]) }}" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">{{ img[1] }}</h5>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
