<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Upload de Carros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Upload de Imagem de Carro</h2>

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-info">
              {% for message in messages %}
                {{ message }}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Formulário de Upload -->
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="imagem" class="form-label">Escolha uma imagem:</label>
                <input class="form-control" type="file" name="imagem" id="imagem" required>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição:</label>
                <input class="form-control" type="text" name="descricao" id="descricao" placeholder="Ex: Mustang vermelho" required>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <a href="/" class="btn btn-secondary ms-2">Voltar para Galeria</a>
        </form>
    </div>
</body>
</html>
